plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wangbuliao.todo'
    compileSdk 34

    defaultConfig {
        applicationId "com.wangbuliao.todo"
        minSdk 26
        targetSdk 34
        versionCode 10503
        versionName '1.5.3'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    signingConfigs {
        release {
            // v1.4.1 起：release 签名统一指向 debug keystore（真机在装包即 debug 签名，
            // 此后 debug/release 同签名可直接覆盖安装，不再因签名不同卸载重装）。
            // 旧 wbl.keystore 仅存档于 release/keystore-backup/，不再用于新包签名。
            storeFile rootProject.file('keystore/wbl-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.compose.ui:ui:1.5.4'
    implementation 'androidx.compose.foundation:foundation:1.5.4'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.compose.material:material-icons-extended:1.5.4'

    // 单元测试（本地 JVM，无需设备）
    testImplementation 'junit:junit:4.12'
}
